<style>

.qt{font-weight:600}

.ans b{display:block;font-size:12px;color:var(--grey)}
.ans .rf b{color:var(--accent)}

.score button.f[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.score input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14px;margin:8px 0 14px}

.note{font-size:13px;color:var(--grey)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:860px){.wrap{grid-template-columns:1fr}nav{display:none}.ans{grid-template-columns:1fr}header{position:static}}

 C1/C2 实操未通过，该模块须签约前在附件一降级、移至后期或外包。"}, {"k": "li", "t": "中风险模块：得分低于 50% 的，在项目计划中前置验证并预留缓冲。"}, {"k": "li", "t": "工期：C7 估算总人日超过可投入人日 10% 以上的，用估算表与甲方谈延长工期或分期，不在违约金条款上硬扛。"}], "subs": []}, {"title": "六、出题过程中发现的范围隐患", "blocks": [{"k": "p", "t": "以下问题不论团队答得如何，都需要在附件一签署前与甲方确认："}, {"k": "li", "t": "iOS 虚拟商品支付：附件一只写了微信支付。课程属于数字内容，iOS 端通常须走苹果 IAP，涉及 15%~30% 抽成和单独开发。"}, {"k": "li", "t": "直播资质：直播和课程内容可能涉及网络文化、视听类许可，需甲方主体具备或确认运营方式。"}, {"k": "li", "t": "分账合规：分佣结算须采用持牌支付机构的分账产品，平台不能代收再转账（附件一第四部分已有原则，需落到具体产品）。"}, {"k": "li", "t": "生成式 AI 合规：需使用已备案的大模型服务并对生成内容加标识，费用和供应商在附件三确认。"}, {"k": "li", "t": "ICP 备案与软著：备案需甲方主体，周期 1~3 周；部分安卓市场要求软著，申请周期较长，需尽早启动。"}], "subs": []}], "groups": [{"name": "投入与组织", "prefix": "A", "lo": 1, "hi": 9, "max": 27, "risk": "决定性"}, {"name": "架构与工程", "prefix": "B", "lo": 1, "hi": 7, "max": 21, "risk": "中"}, {"name": "账号体系", "prefix": "B", "lo": 8, "hi": 11, "max": 12, "risk": "低"}, {"name": "C 端 App 与前端", "prefix": "B", "lo": 12, "hi": 18, "max": 21, "risk": "中"}, {"name": "课程学习", "prefix": "B", "lo": 19, "hi": 22, "max": 12, "risk": "中"}, {"name": "AI 学习管家", "prefix": "B", "lo": 23, "hi": 31, "max": 27, "risk": "中"}, {"name": "商城与支付", "prefix": "B", "lo": 32, "hi": 37, "max": 18, "risk": "高"}, {"name": "直播 Lite", "prefix": "B", "lo": 38, "hi": 44, "max": 21, "risk": "高"}, {"name": "分佣结算", "prefix": "B", "lo": 45, "hi": 50, "max": 18, "risk": "高"}, {"name": "后台与商家端", "prefix": "B", "lo": 51, "hi": 54, "max": 12, "risk": "中"}, {"name": "测试与上线", "prefix": "B", "lo": 55, "hi": 59, "max": 15, "risk": "中"}, {"name": "产品与需求", "prefix": "B", "lo": 60, "hi": 63, "max": 12, "risk": "中"}]};
const KEY = 'xzai-assess-v1';
const S = JSON.parse(localStorage.getItem(KEY) || '{"scores":{},"notes":{},"meta":{}}');
const save = () => { localStorage.setItem(KEY, JSON.stringify(S)); refresh(); };
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : e.setAttribute(k, v);
  for (const c of kids) e.append(c);
  return e;
};
const QS = [];
let anchor = 0;
const slug = () => 's' + (anchor++);

function renderBlocks(parent, blocks) {
  let ul = null;
  for (const b of blocks) {
    if (b.k !== 'li') ul = null;
    if (b.k === 'p') parent.append(el('p', {}, b.t));
    else if (b.k === 'li') {
      if (!ul) { ul = el('ul'); parent.append(ul); }
      const i = b.t.indexOf('：');
      const li = el('li');
      if (i > 0 && i <= 14) li.append(el('strong', {}, b.t.slice(0, i + 1)), b.t.slice(i + 1));
      else li.append(b.t);
      ul.append(li);
    } else if (b.k === 'q') b.rows.slice(1).forEach(r => parent.append(question(r)));
    else parent.append(el('div', { class: 'tw' }, table(b.rows, b.k === 'summary')));
  }
}

function table(rows, isSummary) {
  const t = el('table');
  const thead = el('thead'), tr = el('tr');
  rows[0].forEach(h => tr.append(el('th', { scope: 'col' }, h)));
  thead.append(tr); t.append(thead);
  const tb = el('tbody');
  rows.slice(1).forEach((r, i) => {
    const row = el('tr');
    r.forEach((c, j) => {
      const td = el(j === 0 ? 'th' : 'td', j === 0 ? { scope: 'row' } : {}, c);
      if (isSummary) { if (j === 3) td.id = 'sum-' + i; if (j === 5) td.id = 'pass-' + i; }
      row.append(td);
    });
    tb.append(row);
  });
  t.append(tb);
  return t;
}

function question([id, q, ok, flag]) {
  QS.push(id);
  const box = el('article', { class: 'q', id: 'q-' + id, 'aria-labelledby': 'qt-' + id });
  box.append(el('div', { class: 'qh' }, el('span', { class: 'qid' }, id), el('span', { class: 'qt', id: 'qt-' + id }, q)));
  const det = el('details');
  det.append(el('summary', {}, '查看合格要点与红旗信号'),
    el('div', { class: 'ans' },
      el('div', {}, el('b', {}, '合格回答要点'), ok),
      el('div', { class: 'rf' }, el('b', {}, '红旗信号（出现记 0 分）'), flag)));
  box.append(det);
  const sc = el('div', { class: 'score', role: 'group', 'aria-label': id + ' 评分' }, el('span', {}, '评分'));
  [['0', '0'], ['1', '1'], ['2', '2'], ['3', '3'], ['F', '红旗']].forEach(([v, label]) => {
    const btn = el('button', { type: 'button', 'aria-pressed': String(S.scores[id] === v), 'data-v': v }, label);
    if (v === 'F') btn.classList.add('f');
    btn.onclick = () => { S.scores[id] = S.scores[id] === v ? undefined : v; save(); };
    sc.append(btn);
  });
  const note = el('input', { type: 'text', placeholder: '备注：原话、疑点、追问', 'aria-label': id + ' 备注' });
  note.value = S.notes[id] || '';
  note.oninput = () => { S.notes[id] = note.value; localStorage.setItem(KEY, JSON.stringify(S)); };
  sc.append(note);
  box.append(sc);
  return box;
}

const val = v => v === 'F' ? 0 : Number(v);
function groupOf(id) {
  const m = id.match(/^([A-Z])(\d+)$/);
  return m && DATA.groups.findIndex(g => g.prefix === m[1] && +m[2] >= g.lo && +m[2] <= g.hi);
}

function refresh() {
  const done = QS.filter(id => S.scores[id] !== undefined).length;
  document.getElementById('progress').textContent = `已评 ${done} / ${QS.length} 题`;
  QS.forEach(id => {
    const box = document.getElementById('q-' + id), v = S.scores[id];
    box.classList.toggle('scored', v !== undefined && v !== 'F');
    box.classList.toggle('flag', v === 'F');
    box.querySelectorAll('.score button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  });
  DATA.groups.forEach((g, i) => {
    const ids = QS.filter(id => groupOf(id) === i);
    const scored = ids.filter(id => S.scores[id] !== undefined);
    const sum = scored.reduce((a, id) => a + val(S.scores[id]), 0);
    const cell = document.getElementById('sum-' + i), pass = document.getElementById('pass-' + i);
    if (!cell) return;
    cell.textContent = scored.length ? `${sum}（已评 ${scored.length}/${ids.length}）` : '';
    pass.className = '';
    if (scored.length < ids.length) { pass.textContent = scored.length ? '评分中' : ''; pass.className = 'pend'; return; }
    const flagged = ids.some(id => S.scores[id] === 'F');
    const line = g.risk === '高' ? 0.6 : g.risk === '决定性' ? 0.6 : 0.5;
    const ok = sum >= g.max * line && !(g.risk === '决定性' && flagged);
    pass.textContent = ok ? '通过' : (g.risk === '决定性' ? '不通过（先解决人力）' : '不通过');
    pass.className = ok ? 'pass' : 'fail';
  });
}

function build() {
  document.getElementById('title').textContent = DATA.title;
  const main = document.getElementById('main'), toc = document.getElementById('toc');
  for (const s of DATA.sections) {
    const id = slug(), sec = el('section', { 'aria-labelledby': id });
    sec.append(el('h2', { id }, s.title));
    toc.append(el('a', { href: '#' + id }, s.title));
    renderBlocks(sec, s.blocks);
    for (const sub of s.subs) {
      const sid = slug();
      sec.append(el('h3', { id: sid }, sub.title));
      toc.append(el('a', { href: '#' + sid, class: 'l2' }, sub.title));
      renderBlocks(sec, sub.blocks);
    }
    main.append(sec);
  }
  for (const k of ['who', 'rater']) {
    const i = document.getElementById(k);
    i.value = S.meta[k] || '';
    i.oninput = () => { S.meta[k] = i.value; localStorage.setItem(KEY, JSON.stringify(S)); };
  }
  let open = false;
  document.getElementById('expand').onclick = e => {
    open = !open;
    document.querySelectorAll('.q details').forEach(d => d.open = open);
    e.target.textContent = open ? '收起全部答案' : '展开全部答案';
  };
  document.getElementById('print').onclick = () => {
    document.querySelectorAll('.q details').forEach(d => d.open = true); window.print();
  };
  document.getElementById('reset').onclick = () => {
    if (!confirm('确定清空本机保存的全部评分和备注？此操作不可撤销。')) return;
    S.scores = {}; S.notes = {};
    document.querySelectorAll('.score input').forEach(i => i.value = '');
    save();
  };
  document.getElementById('export').onclick = () => {
    const esc = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
    const lines = [['被评估', '评分人', '题号', '问题', '得分', '备注'].map(esc).join(',')];
    QS.forEach(id => {
      const v = S.scores[id];
      lines.push([S.meta.who, S.meta.rater, id, document.getElementById('qt-' + id).textContent,
        v === 'F' ? '0（红旗）' : (v ?? ''), S.notes[id]].map(esc).join(','));
    });
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = el('a', { href: URL.createObjectURL(blob), download: `胜任力评分_${S.meta.who || '团队'}.csv` });
    document.body.append(a); a.click(); a.remove();
  };
  refresh();
}
build();
</script>
